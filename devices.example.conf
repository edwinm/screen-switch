# Machines that share the monitor, one per line, in menu order:
#
#   <input code>|<name>|<mode>
#
# input code  the monitor's VCP 0x60 value for that port -- see config.sh
# name        whatever you want to see in the menu
# mode        'extended' (restore your normal arrangement -- this Mac) or
#             'mirrored' (mirror onto your own screen -- another machine has
#             the monitor). 'mac' and 'work' are accepted as the old names.
#
# The Settings... window edits this for you; adding a machine is one sheet, and
# "Use Monitor's Current Input" fills the code in by reading the monitor.
#
# It lives at ~/.config/screen-switch/devices.conf.

16|This Mac|extended
17|Work laptop|mirrored
